<!-- Page header -->
<section class="hero">
  <div class="hero-overlay">
    <div class="hero-content">
        <h1>{{ page?.title }}</h1>
      </div>
  </div>
  <div class="hero-wave">
    <svg viewBox="0 0 1440 150" preserveAspectRatio="none">
      <!-- Prvi talas - svetloplavi -->
      <path
        d="M0 10
       C180 15 300 45 480 85
       C650 125 790 130 960 85
       C1150 35 1300 10 1440 15
       L1440 150 L0 150 Z"
        fill="#36a9ed"/>
      <!-- Drugi talas - plavi -->
      <path
        d="M0 28
       C180 35 310 65 490 100
       C660 138 800 140 970 100
       C1160 55 1300 28 1440 32
       L1440 150 L0 150 Z"
        fill="#b8e2fa"/>
      <!-- Treći talas - veoma svetloplavi -->
      <path
        d="M0 48
       C190 55 330 82 520 115
       C690 145 850 145 1030 112
       C1200 82 1340 48 1440 52
       L1440 150 L0 150 Z"
        fill="#eaf3fa"/>
      <!-- Četvrti talas - svetla pozadina -->
      <path
        d="M0 68
       C200 75 360 100 550 125
       C730 148 890 148 1070 125
       C1240 102 1370 68 1440 72
       L1440 150 L0 150 Z"
        fill="#f4f8fc"/>
      <!-- Peti talas - završni sloj -->
      <path
        d="M0 88
       C220 92 380 112 570 135
       C760 150 930 150 1110 135
       C1280 115 1380 88 1440 92
       L1440 150 L0 150 Z"
        fill="#f4f8ff"/>
    </svg>
  </div>
</section >
<div class="dashboard-container">
  <!-- Alerts -->
  @if (message) {
  <div [class]="'alert alert-' + messageType">
    {{ message }}
  </div>
  }
  <main class="main-content-news">
    <!-- News section -->
    <section class="news-section">
      <!-- HEADER -->
      @if(adminIsLogged){
      <div class="news-header">
        <button
          mat-flat-button
          class="add-article-button"
          (click)="addArticle()">
          <mat-icon>add</mat-icon>
          {{ 'ADD_ARTICLE' | translate }}
        </button>
        <button
          mat-flat-button
          class="edit-page-button"
          (click)="editPage()">
          <mat-icon>edit</mat-icon>
          {{ 'EDIT_PAGE' | translate }}
        </button>
      </div>
      }
      <div class="articles-grid">
        <ng-container *ngFor="let article of page?.articles">

          <div class="article-card"
               *ngIf="article.title || article.shortDescription || article.description">

            <h2 class="article-title">{{ article.title }}</h2>

            <div class="short-description"
                 [innerHTML]="article.shortDescription">
            </div>

            <div *ngIf="article.shortDescription && article.description">
              <a class="more-link" [routerLink]="['/articles', article.id]">
                {{'READ_MORE' | translate }}
              </a>
            </div>
            @if(adminIsLogged){
            <div class="article-action">
              <button class="icon-button-edit"
                mat-icon-button
                [matTooltip]="'EDIT_ARTICLE' | translate"
                (click)="editArticle(article)">
                <mat-icon>edit</mat-icon>
              </button>
              <button class="icon-button-delete"
                mat-icon-button
                matTooltip=""
                [matTooltip]="'DELETE_ARTICLE' | translate"
                (click)="deleteArticle(article)">
                <mat-icon>delete_outline</mat-icon>
              </button>
            </div>
            }
          </div>

        </ng-container>
      </div>
      <!--end news section-->
    </section>
  </main>
</div>
