<!-- Page header -->
<section class="hero">
  <div class="hero-overlay">
    <div class="hero-content">
        <h1>{{ page?.title }}</h1>
      </div>
  </div>
  <div class="hero-wave">
    <svg viewBox="0 0 1440 150" preserveAspectRatio="none">
      <!-- Prvi talas - svetloplavi -->
      <path
        d="M0 15
       C180 65 300 90 490 65
       C690 35 790 15 970 45
       C1160 75 1300 65 1440 25
       L1440 150 L0 150 Z"
        fill="#36a9ed"/>

      <!-- Drugi talas - plavi -->
      <path
        d="M0 35
       C180 85 320 105 510 80
       C700 55 830 30 1010 55
       C1190 80 1320 75 1440 45
       L1440 150 L0 150 Z"
        fill="#b8e2fa"/>

      <!-- Treći talas - veoma svetloplavi -->
      <path
        d="M0 55
       C190 100 340 115 540 90
       C750 65 870 45 1050 70
       C1230 95 1350 85 1440 65
       L1440 150 L0 150 Z"
        fill="#eaf3fa"/>

      <!-- Četvrti talas - svetla pozadina -->
      <path
        d="M0 75
       C220 115 350 125 550 105
       C750 85 900 65 1080 88
       C1250 108 1360 100 1440 85
       L1440 150 L0 150 Z"
        fill="#f4f8fc"/>

      <!-- Peti talas - završni sloj -->
      <path
        d="M0 95
       C220 130 370 138 570 120
       C780 100 920 85 1100 105
       C1260 122 1370 115 1440 105
       L1440 150 L0 150 Z"
        fill="#f4f8ff"/>
    </svg>
  </div>
</section >
<div class="dashboard-container">
  <!-- Alerts -->
  <div *ngIf="message"
       [class]="'alert alert-' + messageType">
    {{ message }}
  </div>
  <main class="main-content-news">
    <!-- News section -->
    <section class="news-section">
      <!-- HEADER -->
      @if(adminIsLogged){
      <div class="news-header">
        <button
          mat-flat-button
          class="add-article-button"
          (click)="addArticle()">
          <mat-icon>add</mat-icon>
          {{ 'ADD_ARTICLE' | translate }}
        </button>
        <button
          mat-flat-button
          class="edit-page-button"
          (click)="editPage()">
          <mat-icon>edit</mat-icon>
          {{ 'EDIT_PAGE' | translate }}
        </button>
      </div>
      }
      <div class="articles-grid">
        <ng-container *ngFor="let article of page?.articles">

          <div class="article-card"
               *ngIf="article.title || article.shortDescription || article.description">

            <h2 class="article-title">{{ article.title }}</h2>

            <div class="short-description"
                 [innerHTML]="article.shortDescription">
            </div>

            <div *ngIf="article.shortDescription && article.description">
              <a class="more-link" [routerLink]="['/articles', article.id]">
                {{'READ_MORE' | translate }}
              </a>
            </div>
            @if(adminIsLogged){
            <div class="article-action">
              <button class="icon-button-edit"
                mat-icon-button
                [matTooltip]="'EDIT_ARTICLE' | translate"
                (click)="editArticle(article)">
                <mat-icon>edit</mat-icon>
              </button>
              <button class="icon-button-delete"
                mat-icon-button
                matTooltip=""
                [matTooltip]="'DELETE_ARTICLE' | translate"
                (click)="deleteArticle(article)">
                <mat-icon>delete_outline</mat-icon>
              </button>
            </div>
            }
          </div>

        </ng-container>
      </div>
      <!--end news section-->
    </section>
  </main>
</div>
