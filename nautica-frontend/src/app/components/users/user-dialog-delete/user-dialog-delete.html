<h2 mat-dialog-title class="dialog-title">
  <mat-icon>person</mat-icon>
  {{'DELETE_USER' | translate}}
</h2>
<mat-dialog-content>
  {{messageToShow}}
</mat-dialog-content>

<!-- ACTIONS -->
<mat-dialog-actions align="end">
  <button
    mat-button
    type="button"
    (click)="cancel()">
    {{'CANCEL' | translate}}
  </button>

  <button
    mat-flat-button
    class="primary-color"
    type="button"
    (click)="deleteUser()">
    <mat-icon>delete_outline</mat-icon>
    {{'DELETE' | translate}}
  </button>
</mat-dialog-actions>
