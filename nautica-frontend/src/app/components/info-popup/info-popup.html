<h2 mat-dialog-title class="dialog-title">
  {{popupTitle}}
</h2>
<mat-dialog-content>
  <div class="dialog-content">
    {{messageToShow}}
  </div>
</mat-dialog-content>

<!-- ACTIONS -->
<mat-dialog-actions align="end">
  <button
    mat-button
    type="button"
    (click)="cancel()">
    {{'CLOSE' | translate}}
  </button>
</mat-dialog-actions>
