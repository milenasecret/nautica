<h2 mat-dialog-title class="dialog-title">
  <mat-icon>{{isEdit ? 'edit' : 'add'}}</mat-icon>
  {{isEdit ? ('EDIT_ARTICLE' | translate) : ('ADD_ARTICLE' | translate)}}
</h2>

<mat-dialog-content>
  <form (ngSubmit)="save()" [formGroup]="articleForm" class="dialog-content">
    <!-- TITLE -->
    <mat-form-field appearance="outline">
      <mat-label>{{'TITLE' | translate}}</mat-label>
      <input
        matInput
        formControlName="title"
        [placeholder]="'TYPE_TITLE' | translate">
    </mat-form-field>

    <!-- SHORT DESCRIPTION -->
      <label for="shortDescription">{{'SHORT_DESCRIPTION' | translate}}</label>
      <quill-editor
        formControlName="shortDescription"
        format="html">
      </quill-editor>
    <!--  DESCRIPTION -->
    <label for="description">{{'DESCRIPTION' | translate}}</label>
      <quill-editor
        formControlName="description"
        format="html">
      </quill-editor>




  </form>
</mat-dialog-content>

<!-- ACTIONS -->
<mat-dialog-actions align="end">
  <button
    mat-button
    type="button"
    (click)="cancel()">
    {{'CANCEL' | translate}}
  </button>

  <button
    mat-flat-button
    class="primary-color"
    type="submit"
    (click)="save()">
    <mat-icon>save</mat-icon>
    {{isEdit ? ('SAVE' | translate) : ('ADD_ARTICLE' | translate)}}
  </button>
</mat-dialog-actions>
