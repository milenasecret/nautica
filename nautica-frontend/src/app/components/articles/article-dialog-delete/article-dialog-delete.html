<h2 mat-dialog-title class="dialog-title">
  <mat-icon>delete_outline</mat-icon>
  {{'DELETE_ARTICLE' | translate}}
</h2>
<mat-dialog-content>
  <div class="dialog-content">
    {{messageToShow}}
  </div>
</mat-dialog-content>

<!-- ACTIONS -->
<mat-dialog-actions align="end">
  <button
    mat-button
    type="button"
    (click)="cancel()">
    {{'CANCEL' | translate}}
  </button>

  <button
    mat-flat-button
    class="primary-color"
    type="submit"
    (click)="deleteArticle()">
    <mat-icon>delete_outline</mat-icon>
    {{'DELETE' | translate}}
  </button>
</mat-dialog-actions>
