<!-- Page header -->
<section class="hero">
  <div class="hero-overlay">
    <div class="hero-content">
        <h1></h1>
        <p></p>
        <div class="hero-underline"></div>
      </div>
    </div>
  <div class="hero-wave">
    <svg viewBox="0 0 1440 150" preserveAspectRatio="none">
      <!-- Prvi talas - svetloplavi -->
      <path
        d="M0 15
       C180 65 300 90 490 65
       C690 35 790 15 970 45
       C1160 75 1300 65 1440 25
       L1440 150 L0 150 Z"
        fill="#36a9ed"/>

      <!-- Drugi talas - plavi -->
      <path
        d="M0 35
       C180 85 320 105 510 80
       C700 55 830 30 1010 55
       C1190 80 1320 75 1440 45
       L1440 150 L0 150 Z"
        fill="#b8e2fa"/>

      <!-- Treći talas - veoma svetloplavi -->
      <path
        d="M0 55
       C190 100 340 115 540 90
       C750 65 870 45 1050 70
       C1230 95 1350 85 1440 65
       L1440 150 L0 150 Z"
        fill="#eaf3fa"/>

      <!-- Četvrti talas - svetla pozadina -->
      <path
        d="M0 75
       C220 115 350 125 550 105
       C750 85 900 65 1080 88
       C1250 108 1360 100 1440 85
       L1440 150 L0 150 Z"
        fill="#f4f8fc"/>

      <!-- Peti talas - završni sloj -->
      <path
        d="M0 95
       C220 130 370 138 570 120
       C780 100 920 85 1100 105
       C1260 122 1370 115 1440 105
       L1440 150 L0 150 Z"
        fill="#f4f8ff"/>
    </svg>
  </div>
</section >
<div class="dashboard-container">
  <!-- Alerts -->
  <div *ngIf="errorMessage"
       class="alert alert-error">
    {{ errorMessage }}
  </div>
  <main class="main-content-login">
    <!-- login section -->
    <section class="login-section">
      <div class="login-card">
        <h2 class="primary-color-font">{{ 'LOGIN' | translate }}</h2>

        <form (ngSubmit)="onLogin()" [formGroup]="loginForm">

          <div class="form-group">
            <mat-form-field appearance="outline">
              <mat-label>Username *</mat-label>
              <input
                matInput
                formControlName="username"
                [placeholder]="'TYPE_USERNAME' | translate">
              <mat-error
                *ngIf="loginForm.controls['username'].hasError('required')">
                {{'USERNAME_IS_REQUIRED' | translate}}
              </mat-error>
            </mat-form-field>
          </div>

          <div class="form-group">
            <mat-form-field appearance="outline">
              <mat-label>
                Password *
              </mat-label>
              <input
                matInput
                [type]="hidePassword ? 'password' : 'text'"
                formControlName="password"
                [placeholder]="'TYPE_PASSWORD' | translate">
              <button
                mat-icon-button
                matSuffix
                type="button"
                (click)="hidePassword = !hidePassword">
                <mat-icon>
                  {{hidePassword ? 'visibility_off' : 'visibility'}}
                </mat-icon>
              </button>
              <mat-error *ngIf="loginForm.controls['password'].hasError('required')">
                {{'PASSWORD_IS_REQUIRED' | translate}}
              </mat-error>
            </mat-form-field>

          </div>
          <div class="button-container">
            <button
              mat-flat-button
              class="primary-color"
              type="submit"
              [disabled]="!loginForm.valid || isLoading"
              (click)="onLogin()"
            >
              {{ isLoading ? ('LOGGING' | translate) : ('SEND' | translate) }}
            </button>
          </div>
        </form>

        <p class="register-link">
          {{ 'FORGOT_PASSWORD' | translate }}? <a routerLink="/forgot-password">{{ 'RESET_IT_HERE' | translate }}</a>
        </p>
      </div>

      <!--end login section-->
    </section>
  </main>
</div>
