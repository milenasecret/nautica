<div class="dashboard-container">
  <!-- Page header -->
  <header class="page-header">
    <div class="page-heading">
      <div>
        <h1></h1>
      </div>
    </div>
  </header>
  <!-- Alerts -->
  <div *ngIf="errorMessage"
       class="alert alert-error">
    {{ errorMessage }}
  </div>
  <main class="main-content">
    <!-- forgot password section -->
    <section class="forgot-password-section">
      <div class="forgot-password-card">
        <h2 class="primary-color-font">{{ 'RESET_PASSWORD' | translate }}</h2>
        <div class="padding-bottom-10">
          {{'FORGOT_PASSWORD_TEXT' | translate}}
        </div>
        <form (ngSubmit)="onForgotPassword()" [formGroup]="forgotPasswordForm">
          <div class="form-group">
            <mat-form-field appearance="outline">
              <mat-label>Email *</mat-label>
              <input
                matInput
                type="email"
                formControlName="email"
                [placeholder]="'TYPE_EMAIL' | translate">
              <mat-error
                *ngIf="forgotPasswordForm.controls['email'].hasError('required')">
                {{'EMAIL_IS_REQUIRED' | translate}}
              </mat-error>
              <mat-error
                *ngIf="forgotPasswordForm.controls['email'].hasError('email')">
                {{'ENTER_RIGHT_EMAIL' | translate}}
              </mat-error>
            </mat-form-field>
          </div>
          <div class="button-container">
            <button
              mat-flat-button
              class="primary-color"
              type="submit"
              [disabled]="!forgotPasswordForm.valid || isLoading"
            >
              {{ isLoading ? ('LOGGING' | translate) : ('SEND' | translate) }}
            </button>
          </div>
        </form>
      </div>

      <!--end forgot password section-->
    </section>
  </main>
</div>
