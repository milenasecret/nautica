<!-- Page header -->
<section class="hero">
  <div class="hero-overlay">
    <div class="hero-content">
        <h1></h1>
        <p></p>
      </div>
    </div>
  <div class="hero-wave">
    <svg viewBox="0 0 1440 150" preserveAspectRatio="none">
      <!-- Prvi talas - svetloplavi -->
      <path
        d="M0 10
       C180 15 300 45 480 85
       C650 125 790 130 960 85
       C1150 35 1300 10 1440 15
       L1440 150 L0 150 Z"
        fill="#36a9ed"/>
      <!-- Drugi talas - plavi -->
      <path
        d="M0 28
       C180 35 310 65 490 100
       C660 138 800 140 970 100
       C1160 55 1300 28 1440 32
       L1440 150 L0 150 Z"
        fill="#b8e2fa"/>
      <!-- Treći talas - veoma svetloplavi -->
      <path
        d="M0 48
       C190 55 330 82 520 115
       C690 145 850 145 1030 112
       C1200 82 1340 48 1440 52
       L1440 150 L0 150 Z"
        fill="#eaf3fa"/>
      <!-- Četvrti talas - svetla pozadina -->
      <path
        d="M0 68
       C200 75 360 100 550 125
       C730 148 890 148 1070 125
       C1240 102 1370 68 1440 72
       L1440 150 L0 150 Z"
        fill="#f4f8fc"/>
      <!-- Peti talas - završni sloj -->
      <path
        d="M0 88
       C220 92 380 112 570 135
       C760 150 930 150 1110 135
       C1280 115 1380 88 1440 92
       L1440 150 L0 150 Z"
        fill="#f4f8ff"/>
    </svg>
  </div>
</section >
<div class="dashboard-container">
  <!-- Alerts -->
  <div *ngIf="errorMessage"
       class="alert alert-error">
    {{ errorMessage }}
  </div>
  <main class="main-content-forgot">
    <!-- forgot password section -->
    <section class="forgot-password-section">
      <div class="forgot-password-card">
        <h2 class="primary-color-font">{{ 'RESET_PASSWORD' | translate }}</h2>
        <div class="padding-bottom-10">
          {{'FORGOT_PASSWORD_TEXT' | translate}}
        </div>
        <form (ngSubmit)="onForgotPassword()" [formGroup]="forgotPasswordForm">
          <div class="form-group">
            <mat-form-field appearance="outline">
              <mat-label>Email *</mat-label>
              <input
                matInput
                type="email"
                formControlName="email"
                [placeholder]="'TYPE_EMAIL' | translate">
              <mat-error
                *ngIf="forgotPasswordForm.controls['email'].hasError('required')">
                {{'EMAIL_IS_REQUIRED' | translate}}
              </mat-error>
              <mat-error
                *ngIf="forgotPasswordForm.controls['email'].hasError('email')">
                {{'ENTER_RIGHT_EMAIL' | translate}}
              </mat-error>
            </mat-form-field>
          </div>
          <div class="button-container">
            <button
              mat-flat-button
              class="primary-color"
              type="submit"
              [disabled]="!forgotPasswordForm.valid || isLoading"
            >
              {{ isLoading ? ('LOGGING' | translate) : ('SEND' | translate) }}
            </button>
          </div>
        </form>
      </div>

      <!--end forgot password section-->
    </section>
  </main>
</div>
