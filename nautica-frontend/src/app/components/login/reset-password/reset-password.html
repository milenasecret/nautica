<div class="dashboard-container">
  <!-- Page header -->
  <header class="page-header">
    <div class="page-heading">
      <div>
        <h1></h1>
      </div>
    </div>
  </header>
  <!-- Alerts -->
  <div *ngIf="errorMessage"
       class="alert alert-error">
    {{ errorMessage }}
  </div>
  <main class="main-content">
    <!-- reset password section -->
    <section class="reset-password-section">
      <div class="reset-password-card">
        <h2 class="primary-color-font">{{ 'RESET_PASSWORD' | translate }}</h2>
        <div class="padding-bottom-10">
          {{'RESET_PASSWORD_TEXT' | translate }}
        </div>
        <form (ngSubmit)="onResetPassword()" [formGroup]="resetPasswordForm">
          <div class="form-group">
            <mat-form-field appearance="outline">
              <mat-label>
                Password *
              </mat-label>
              <input
                matInput
                [type]="hidePassword ? 'password' : 'text'"
                formControlName="password"
                [placeholder]="'TYPE_PASSWORD' | translate">
              <button
                mat-icon-button
                matSuffix
                type="button"
                (click)="hidePassword = !hidePassword">
                <mat-icon>
                  {{hidePassword ? 'visibility_off' : 'visibility'}}
                </mat-icon>
              </button>
              <mat-error *ngIf="resetPasswordForm.controls['password'].hasError('required')">
                {{'PASSWORD_IS_REQUIRED' | translate}}
              </mat-error>
            </mat-form-field>
          </div>
          <div class="button-container">
            <button
              mat-flat-button
              class="primary-color"
              type="submit"
              [disabled]="!resetPasswordForm.valid || isLoading"
            >
              {{ isLoading ? ('LOGGING' | translate) : ('SEND' | translate) }}
            </button>
          </div>
        </form>
      </div>

      <!--end reset password section-->
    </section>
  </main>
</div>
